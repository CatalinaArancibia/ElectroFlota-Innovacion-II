<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ElectroFlota — Ingreso</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root{ --corp:#E10600; --corp-dark:#b30500; }
    body{ min-height:100vh; margin:0; display:flex; align-items:center; justify-content:center;
      background:linear-gradient(135deg,#11161d,#1c2630); font-family:system-ui,Segoe UI,Roboto,sans-serif; padding:20px; }
    .login-card{ width:100%; max-width:410px; background:#fff; border-radius:18px; overflow:hidden;
      box-shadow:0 18px 50px rgba(0,0,0,.45); }
    .login-head{ background:var(--corp); color:#fff; padding:1.6rem; text-align:center; }
    .logo{ width:54px; height:54px; background:#fff; color:var(--corp); border-radius:12px; margin:0 auto .7rem;
      display:flex; align-items:center; justify-content:center; font-weight:800; font-size:26px; }
    .login-body{ padding:1.6rem; }
    .btn-corp{ background:var(--corp); border-color:var(--corp); color:#fff; font-weight:600; }
    .btn-corp:hover{ background:var(--corp-dark); border-color:var(--corp-dark); color:#fff; }
    .demo-note{ font-size:.78rem; }
    .acct{ cursor:pointer; }
    .acct:hover{ background:#f6f7f9; }
    .roldot{ width:9px; height:9px; border-radius:50%; display:inline-block; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-head">
      <div class="logo">EF</div>
      <div class="fs-4 fw-bold">ElectroFlota</div>
      <div class="opacity-75 small">Panel de gestión · Región de Coquimbo</div>
    </div>
    <div class="login-body">

      <form id="loginForm" autocomplete="off">
        <div class="mb-3">
          <label class="form-label small fw-semibold">Usuario</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <input type="text" class="form-control" id="user" placeholder="usuario" required>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label small fw-semibold">Contraseña</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control" id="pass" placeholder="••••••••" required>
          </div>
        </div>

        <div id="error" class="alert alert-danger py-2 small d-none" role="alert">
          <i class="bi bi-exclamation-circle"></i> Usuario o contraseña incorrectos.
        </div>

        <button type="submit" class="btn btn-corp w-100">
          <i class="bi bi-box-arrow-in-right"></i> Ingresar
        </button>
      </form>

      <!-- Cuentas de prueba (clic para autocompletar) -->
      <div class="mt-4">
        <button class="btn btn-sm btn-light w-100 d-flex justify-content-between align-items-center"
                type="button" data-bs-toggle="collapse" data-bs-target="#cuentas">
          <span class="small fw-semibold"><i class="bi bi-people"></i> Cuentas de prueba</span>
          <i class="bi bi-chevron-down"></i>
        </button>
        <div class="collapse mt-2" id="cuentas">
          <div class="list-group list-group-flush small" id="cuentasList"></div>
        </div>
      </div>

      <div class="alert alert-warning demo-note mt-3 mb-2">
        <i class="bi bi-shield-exclamation"></i>
        <strong>Demostración académica.</strong> El login es simulado en el navegador
        (las credenciales son visibles en el código). No es seguridad real.
      </div>

      <div class="text-center">
        <a href="electroflota_3d_v3.html" class="small text-decoration-none">
          <i class="bi bi-badge-3d"></i> Ver simulación 3D
        </a>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="auth.js"></script>
  <script>
    const $ = s => document.querySelector(s);

    // Listado de cuentas de prueba (desde EF_USERS, siempre sincronizado)
    $('#cuentasList').innerHTML = EF_USERS.map(u => `
      <div class="list-group-item acct d-flex justify-content-between align-items-center"
           data-user="${u.user}" data-pass="${u.pass}">
        <span>
          <span class="roldot me-2" style="background:${EF_ROLES[u.rol].color}"></span>
          <strong>${u.user}</strong> / ${u.pass}
        </span>
        <span class="text-muted">${EF_ROLES[u.rol].label}</span>
      </div>`).join('');

    // Clic en una cuenta → autocompleta usuario y contraseña
    document.querySelectorAll('.acct').forEach(el => el.addEventListener('click', () => {
      $('#user').value = el.dataset.user;
      $('#pass').value = el.dataset.pass;
      $('#error').classList.add('d-none');
    }));

    // Envío del formulario → entra al dashboard
    $('#loginForm').addEventListener('submit', e => {
      e.preventDefault();
      const sess = efLogin($('#user').value, $('#pass').value);
      if(sess){ location.href = 'dashboard.html'; }
      else { $('#error').classList.remove('d-none'); }
    });
  </script>
</body>
</html>
